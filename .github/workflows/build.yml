name: Build Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pkg_type: deb
            artifact: "*.deb"
          - os: windows-latest
            pkg_type: exe
            artifact: "*.exe"
          - os: macos-latest
            pkg_type: dmg
            artifact: "*.dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JavaFX SDK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            JAVAFX_URL="https://download2.gluonhq.com/openjfx/21.0.5/openjfx-21.0.5_linux-x64_bin-sdk.zip"
          else
            JAVAFX_URL="https://download2.gluonhq.com/openjfx/21.0.5/openjfx-21.0.5_osx-x64_bin-sdk.zip"
          fi
          curl -L "$JAVAFX_URL" -o javafx.zip
          unzip -q javafx.zip
          echo "JAVAFX_PATH=$(pwd)/javafx-sdk-21.0.5/lib" >> $GITHUB_ENV

      - name: Download JavaFX SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/21.0.5/openjfx-21.0.5_windows-x64_bin-sdk.zip"
          Invoke-WebRequest -Uri $url -OutFile javafx.zip
          Expand-Archive -Path javafx.zip -DestinationPath .
          echo "JAVAFX_PATH=$(pwd)\javafx-sdk-21.0.5\lib" >> $env:GITHUB_ENV

      - name: Compile (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/classes build/jar/javafx-libs dist
          javac \
            --module-path "$JAVAFX_PATH" \
            --add-modules javafx.controls,javafx.graphics \
            -d build/classes \
            ShowcaseApp.java MainScene.java ShapeFactory.java ExplodeEffect.java
          cp logo.png build/classes/ 2>/dev/null || true
          cp "$JAVAFX_PATH"/*.so build/jar/javafx-libs/ 2>/dev/null || true
          cp "$JAVAFX_PATH"/*.dylib build/jar/javafx-libs/ 2>/dev/null || true
          cp "$JAVAFX_PATH"/*.jar build/jar/javafx-libs/
          cat > build/jar/MANIFEST.MF << MANIFEST
          Manifest-Version: 1.0
          Main-Class: ShowcaseApp
          MANIFEST
          jar cfm build/jar/app.jar build/jar/MANIFEST.MF -C build/classes .

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/classes, build/jar/javafx-libs, dist
          javac `
            --module-path "$env:JAVAFX_PATH" `
            --add-modules javafx.controls,javafx.graphics `
            -d build/classes `
            ShowcaseApp.java MainScene.java ShapeFactory.java ExplodeEffect.java
          Copy-Item logo.png build/classes/ -ErrorAction SilentlyContinue
          Copy-Item "$env:JAVAFX_PATH\*.dll" build/jar/javafx-libs/
          Copy-Item "$env:JAVAFX_PATH\*.jar" build/jar/javafx-libs/
          $manifest = "Manifest-Version: 1.0`nMain-Class: ShowcaseApp`n"
          Set-Content -Path build/jar/MANIFEST.MF -Value $manifest
          jar cfm build/jar/app.jar build/jar/MANIFEST.MF -C build/classes .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          jpackage \
            --type deb \
            --name JavaFXDemo \
            --app-version 1.0 \
            --input build/jar \
            --main-jar app.jar \
            --main-class ShowcaseApp \
            --module-path "$JAVAFX_PATH" \
            --add-modules javafx.controls,javafx.graphics \
            --java-options "--add-modules javafx.controls,javafx.graphics" \
            --java-options "-Djava.library.path=\$APPDIR/javafx-libs" \
            --icon logo.png \
            --dest dist \
            --linux-shortcut \
            --linux-menu-group "Education" \
            --vendor "Martin"
          # Also build RPM for Fedora/RHEL users
          jpackage \
            --type rpm \
            --name JavaFXDemo \
            --app-version 1.0 \
            --input build/jar \
            --main-jar app.jar \
            --main-class ShowcaseApp \
            --module-path "$JAVAFX_PATH" \
            --add-modules javafx.controls,javafx.graphics \
            --java-options "--add-modules javafx.controls,javafx.graphics" \
            --java-options "-Djava.library.path=\$APPDIR/javafx-libs" \
            --icon logo.png \
            --dest dist \
            --linux-shortcut \
            --linux-menu-group "Education" \
            --vendor "Martin"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          jpackage \
            --type dmg \
            --name JavaFXDemo \
            --app-version 1.0 \
            --input build/jar \
            --main-jar app.jar \
            --main-class ShowcaseApp \
            --module-path "$JAVAFX_PATH" \
            --add-modules javafx.controls,javafx.graphics \
            --java-options "--add-modules javafx.controls,javafx.graphics" \
            --java-options "-Djava.library.path=\$APPDIR/javafx-libs" \
            --icon logo.png \
            --dest dist \
            --vendor "Martin"

      - name: Build custom runtime image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          jlink `
            --module-path "$env:JAVAFX_PATH;$env:JAVA_HOME\jmods" `
            --add-modules java.base,java.desktop,java.logging,java.xml,javafx.controls,javafx.graphics,javafx.base `
            --output runtime `
            --strip-debug `
            --no-header-files `
            --no-man-pages
          echo "JAVAFX_RUNTIME_IMAGE=$(pwd)\runtime" >> $env:GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name JavaFXDemo `
            --app-version 1.0 `
            --input build/jar `
            --main-jar app.jar `
            --main-class ShowcaseApp `
            --runtime-image "$env:JAVAFX_RUNTIME_IMAGE" `
            --java-options "-Djava.library.path=`$APPDIR/javafx-libs" `
            --java-options "--add-modules=javafx.controls,javafx.graphics" `
            --icon logo.png `
            --dest dist `
            --vendor "Martin" `
            --win-console `
            --win-shortcut `
            --win-menu `
            --win-menu-group "Education" `
            --win-console

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
        env:
        